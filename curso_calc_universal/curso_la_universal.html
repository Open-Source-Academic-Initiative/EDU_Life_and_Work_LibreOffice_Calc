<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo para mi Negocio y mi Trabajo · Ferretería La Universal</title>
    <link rel="stylesheet" href="css/course.css?v=038cd1239c">
</head>
<body>
    <div class="topbar">
        <button type="button" id="menuBtn" class="icon-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir el contenido del curso">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="brand small">
            <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4 2.5-2.5Z"/></svg></span>
            <span class="brand-name">La Universal</span>
        </div>
        <div class="topbar-progress" aria-hidden="true"><span id="mobileProgress"></span></div>
    </div>

    <div id="scrim" class="scrim" aria-hidden="true"></div>

    <aside id="sidebar" class="sidebar" aria-label="Contenido del curso">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4 2.5-2.5Z"/></svg></span>
            <div>
                <p class="brand-name">La Universal</p>
                <p class="brand-sub">Escuela de Datos · LibreOffice Calc</p>
            </div>
        </div>
        <div class="progress-card">
            <div class="progress-row">
                <span id="progressText">0 % completado</span>
                <span id="scoreText" class="score">Sin evaluaciones aún</span>
            </div>
            <div class="bar" role="progressbar" aria-label="Avance del curso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressBar"></span></div>
            <p id="scoreNote" class="score-note"></p>
        </div>
        <nav>
            <ol id="unitList" class="units"></ol>
            <button type="button" id="summaryLink" class="summary-link">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Zm0 2H5a3 3 0 0 0 3 4m8-4h3a3 3 0 0 1-3 4m-4 3v4m-4 3h8"/></svg>
                <span>Mi progreso y nota final</span>
            </button>
        </nav>
        <p id="previewBadge" class="preview-badge" hidden>Vista previa fuera del campus: el progreso se guarda solo en este navegador.</p>
    </aside>

    <main id="main" class="main">
        <header class="page-head">
            <p id="kicker" class="kicker"></p>
            <h1 id="unitTitle" class="unit-heading">Cargando el curso…</h1>
        </header>
        <div id="stage" class="stage" aria-live="polite">
            <noscript><p>Este curso necesita JavaScript activado en el navegador.</p></noscript>
        </div>
        <footer id="footer" class="nav-footer">
            <button type="button" id="prev" class="btn ghost">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
                <span>Anterior</span>
            </button>
            <span id="counter" class="counter"></span>
            <button type="button" id="next" class="btn primary">
                <span id="nextLabel">Siguiente</span>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
            </button>
        </footer>
    </main>

    <dialog id="zoom" class="zoom" aria-label="Imagen ampliada">
        <button type="button" id="zoomClose" class="icon-btn zoom-close" aria-label="Cerrar imagen">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <img id="zoomImg" alt="">
    </dialog>

    <script src="js/course-data.js?v=8919d00073"></script>
    <script src="js/scorm.js?v=ee1ab6e54a"></script>
    <script src="js/vendor/qrcode.js?v=e84be42f24"></script>
    <script src="js/hash.js?v=cc142b0e43"></script>
    <script src="js/cert-assets.js?v=5507c043a5"></script>
    <script src="js/certificate.js?v=22fa396135"></script>
    <script src="js/player.js?v=1508a05806"></script>
</body>
</html>
